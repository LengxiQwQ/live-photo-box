# PR: repeatable build/test gate. master: Full gate plus package artifact.
# v* tag: Full gate, then package and create a draft release.
name: Build & Release / 构建与发布

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Verification must not be able to modify the repository or Actions state.
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    if: github.event_name != 'push' || (github.event.head_commit.author.name != 'github-actions[bot]' && github.event.head_commit.committer.name != 'github-actions[bot]')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERIFY_SCOPE: ${{ github.event_name == 'pull_request' && 'Fast' || 'Full' }}
    steps:
      - name: Checkout / 拉取代码
        uses: actions/checkout@v4
      - name: Setup .NET 9 and 10 / 安装 .NET 9 与 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Verify build and tests / 构建与测试门禁
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/verify.ps1
          -Scope $env:VERIFY_SCOPE
          -Configuration Release
      - name: Upload Native symbols / 上传 Native 符号
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LivePhotoBox-Native-Symbols-${{ github.run_number }}
          path: artifacts/native/Release/win-x64/LivePhotoBox.Native.pdb
          if-no-files-found: warn
          retention-days: 30

  package:
    needs: verify
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout / 拉取代码
        uses: actions/checkout@v4
      - name: Setup .NET 9 and 10 / 安装 .NET 9 与 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Setup Go / 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Inno Setup / 安装 Inno Setup
        run: choco install innosetup -y --no-progress --limit-output
        shell: pwsh
      - name: Build and package / 构建与打包
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -CI
        shell: pwsh
      - name: Upload package artifacts / 上传打包产物
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: LivePhotoBox-x64-Release
          path: |
            publish/*.zip
            publish/*.exe
          retention-days: 7
      - name: Create draft release / 创建草稿 Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: changelogs/release-${{ github.ref_name }}.md
          draft: true
          prerelease: false
          make_latest: true
          files: |
            publish/*.zip
            publish/*.exe
          fail_on_unmatched_files: false
