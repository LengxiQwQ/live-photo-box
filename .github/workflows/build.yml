# build.yml — GitHub Actions 自动构建与发布
#
# 每次推送到 master → 自动编译验证
# 每次推送 v* 标签  → 自动编译 + 打包 + 创建 Release
#
# 使用方式：
#   git tag v1.14.11
#   git push --tags
#   → GitHub 自动编译、打包 zip/exe、创建 Release（草稿）
#   → 去 Releases 页面检查 → 点 Publish 发布

name: Build & Release

# ── 触发条件 ──────────────────────────────────────────────────
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]           # v1.14.11, v1.14.12 ...
  pull_request:
    branches: [ master ]
  workflow_dispatch:          # 手动触发（不创建 Release）

# ── 权限 ──────────────────────────────────────────────────────
permissions:
  contents: write             # 允许创建 Release 和上传附件

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. 拉取代码 ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. .NET 环境 ─────────────────────────────────────────
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # ── 3. 从标签提取版本号 ──────────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          # 标签格式 v1.14.11 → version3=1.14.11, version4=1.14.11.0
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $xml = [xml](Get-Content "Live Photo Box\Package.appxmanifest" -Raw)
            $v = ($xml.Package.Identity.Version) -replace '\.0$', ''
          }
          echo "version3=$v" >> $env:GITHUB_OUTPUT
          echo "version4=$v.0" >> $env:GITHUB_OUTPUT
          echo "tag=v$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # ── 4. 编译 ──────────────────────────────────────────────
      - name: Build & Publish (x64 Release)
        run: |
          dotnet publish "Live Photo Box\Live Photo Box.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:AppxPackageSigningEnabled=false `
            -p:GenerateTemporaryStoreCertificate=false `
            -o publish\portable_x64
        shell: pwsh

      # ── 5. 正确性检查 ───────────────────────────────────────
      - name: Verify build output
        run: |
          if (-not (Test-Path "publish\portable_x64\Live Photo Box.exe")) {
            Write-Host "::error::Build failed - Live Photo Box.exe not found"
            exit 1
          }
        shell: pwsh

      # ── 5.5 清理无用文件（参照 scripts/build-release.ps1）──
      - name: Strip unused files
        run: |
          $outDir = "publish\portable_x64"
          $removed = 0

          # ── 1. 清理多余语言文件夹（顶层，正则匹配）────────
          $keepLocales = @('zh-CN','en-us')
          Get-ChildItem -Path $outDir -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.Name -match '^[a-z]{2,3}(-[A-Za-z0-9]+)+$' -and $_.Name -notin $keepLocales) {
              Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue
              $removed++
            }
          }
          Write-Host "Removed $removed top-level locale folders (kept $($keepLocales -join ', '))"

          # ── 2. 删除运行时生成的配置文件（开发机残留）─────
          if (Test-Path "$outDir\appsettings.json") {
            Remove-Item -Force "$outDir\appsettings.json"
            Write-Host "Removed appsettings.json"
          }

          # ── 3. 删除 AI/ML 无用文件 ────────────────────────
          foreach ($f in @('DirectML.dll','onnxruntime.dll','onnxruntime_providers_shared.dll','Microsoft.ML.OnnxRuntime.dll')) {
            $p = Join-Path $outDir $f
            if (Test-Path $p) { Remove-Item -Force $p; Write-Host "Removed $f" }
          }
          if (Test-Path "$outDir\NpuDetect") { Remove-Item -Recurse -Force "$outDir\NpuDetect"; Write-Host "Removed NpuDetect/" }
          Get-ChildItem $outDir -Filter 'Microsoft.Windows.AI*' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem $outDir -Filter 'Microsoft.Windows.AI*' -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

          # ── 4. 删除 AI 负载配置和杂项 ─────────────────────
          Remove-Item -Force "$outDir\workloads.json" -ErrorAction SilentlyContinue
          Remove-Item -Force "$outDir\WindowsAppRuntime.png" -ErrorAction SilentlyContinue

          # ── 5. 删除调试符号（发布版不需要）────────────────
          Remove-Item -Force "$outDir\Live Photo Box.pdb" -ErrorAction SilentlyContinue

          # ── 6. 删除 XML 文档 ──────────────────────────────
          Remove-Item -Force "$outDir\*.xml" -ErrorAction SilentlyContinue

          # ── 7. 递归清理 .mui 原生语言资源 ─────────────────
          # 从 csproj 读取 AppSupportedNativeLocales（单一真相源）
          [xml]$csprojXml = Get-Content 'Live Photo Box\Live Photo Box.csproj'
          $nativeLocales = ($csprojXml.Project.PropertyGroup.AppSupportedNativeLocales | Where-Object { $_ }) -split ';'
          Write-Host "AppSupportedNativeLocales from csproj: $($nativeLocales -join ', ')"
          $muiRemoved = 0
          Get-ChildItem -Path $outDir -Recurse -Filter '*.mui' -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.Directory.Name -notin $nativeLocales) {
              Remove-Item -Recurse -Force $_.Directory.FullName -ErrorAction SilentlyContinue
              $muiRemoved++
            }
          }
          Write-Host "Removed $muiRemoved .mui resource dirs"

          # ── 8. 最终大小 ────────────────────────────────────
          $kb = (Get-ChildItem $outDir -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1KB
          Write-Host "Final publish size: $('{0:N0}' -f $kb) KB"
        shell: pwsh

      # ── 6. 打包便携版 zip ────────────────────────────────────
      - name: Package portable zip
        run: |
          $zip = "Live-Photo-Box-v${{ steps.version.outputs.version3 }}-x64-portable.zip"
          Compress-Archive -Path "publish\portable_x64\*" -DestinationPath "publish\$zip" -Force
          Write-Host "Created: $zip"
        shell: pwsh

      # ── 7. 打包安装版 exe ───────────────────────────────────
      - name: Install Inno Setup
        # Inno Setup 只在打 Release 时需要，但提前安装省得重复下载
        run: choco install innosetup -y --no-progress --limit-output
        shell: pwsh

      - name: Build setup installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc /Qp "/dVERSION=${{ steps.version.outputs.version4 }}" "/dVERSION_SHORT=${{ steps.version.outputs.version3 }}" "scripts\setup.iss"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Installer created successfully"
            } else {
              Write-Host "::warning::Inno Setup exited with code $LASTEXITCODE"
            }
          } else {
            Write-Host "::warning::Inno Setup not found at $iscc, skipping installer"
          }
        shell: pwsh

      # ── 8. 上传构建产物（非标签构建） ─────────────────────
      - name: Upload artifacts (non-release builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoBox-x64-Release
          path: |
            publish\*.zip
            publish\*.exe
          retention-days: 30

      # ── 9. 创建 GitHub Release（标签构建） ─────────────────
      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: changelogs/release-v${{ steps.version.outputs.version3 }}.md
          draft: true
          prerelease: false
          make_latest: true
          files: |
            publish\*.zip
            publish\*.exe
          fail_on_unmatched_files: false
