# build.yml — GitHub Actions automatic build & release
# build.yml — GitHub Actions 自动构建与发布
#
# Push to master → automatic build verification
# Push v* tag     → automatic build + package + create Release
# 推送到 master → 自动编译验证
# 推送 v* 标签  → 自动编译 + 打包 + 创建 Release
#
# Usage / 使用方式：
#   git tag v1.14.11
#   git push --tags
#   → GitHub auto-builds, packages zip/exe, creates Release (draft)
#   → Check the Releases page → click Publish to release

name: Build & Release / 构建与发布

# ── Triggers / 触发条件 ──────────────────────────────────────────
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# ── Permissions / 权限 ──────────────────────────────────────────
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout / 拉取代码 ──────────────────────────────────
      - name: Checkout / 拉取代码
        uses: actions/checkout@v4

      # ── 2. Setup .NET / 安装 .NET ───────────────────────────────
      - name: Setup .NET 9 / 安装 .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # ── 2.5 Setup Go / 安装 Go（winget alias shim 编译）───────────
      - name: Setup Go / 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      # ── 3. Install Inno Setup / 安装 Inno Setup ─────────────────
      - name: Install Inno Setup / 安装 Inno Setup
        run: choco install innosetup -y --no-progress --limit-output
        shell: pwsh

      # ── 4. Build & Package / 构建 & 打包 ────────────────────────
      # Uses the same script as local builds — single source of truth
      # 和本地构建用同一个脚本，单一真相源
      - name: Build & Package / 构建 & 打包
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -CI
        shell: pwsh

      # ── 5. Upload artifacts (non-release) / 上传构建产物 ────────
      - name: Upload artifacts (non-release) / 上传构建产物（非 Release）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoBox-x64-Release
          path: |
            publish\*.zip
            publish\*.exe
          retention-days: 7

      # ── 6. Clean old artifact / 清理旧构建产物 ──────────────────
      - name: Clean old artifact / 清理旧构建产物
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          $id = gh api /repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[] | select(.name == "LivePhotoBox-x64-Release" and .expired == false) | .id'
          if ($id) { $id | ForEach-Object { gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$_" } }
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh

      # ── 7. Create GitHub Release (tag builds) / 创建 Release ────
      - name: Create Release / 创建 Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: changelogs/release-${{ github.ref_name }}.md
          draft: true
          prerelease: false
          make_latest: true
          files: |
            publish\*.zip
            publish\*.exe
          fail_on_unmatched_files: false
