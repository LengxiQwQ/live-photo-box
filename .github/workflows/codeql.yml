name: CodeQL / 安全扫描

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!screenshots/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!LICENSE*'
      - '!.gitignore'
      - '!.gitattributes'
      - '!.editorconfig'
      # Formal Verify authority needs exact-HEAD push CI; ordinary docs still skip.
      - 'docs/LivePhotoBox-Current-Roadmap/LivePhotoBox-P5-细分路线图/09-P5-Verify-验证与外部门禁.md'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
          - language: c-cpp
    steps:
      - name: Checkout / 拉取代码
        uses: actions/checkout@v4
      - name: Setup .NET 9 and 10 / 安装 .NET 9 与 10
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore pinned Native dependencies for managed analysis / 恢复 Native 依赖（C#）
        if: matrix.language == 'csharp'
        uses: actions/cache/restore@v4
        with:
          path: |
            .ai-tmp/workspace/P5/R5/video-codecs-main10
            .ai-tmp/workspace/P5/R5/r4-hevc-v2-codec-identity.json
            .ai-tmp/workspace/P5/R5/cmake-build/vcpkg_installed
            ~/AppData/Local/vcpkg/downloads
          key: native-deps-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'tools/p5-r5-video-validation/sidecar-dependencies/**', 'tools/p5-r5-video-validation/profiles/P5-R5-v1/backend-build.json') }}
      - name: Cache pinned Native dependencies for C/C++ analysis / 缓存 Native 依赖（C/C++）
        if: matrix.language == 'c-cpp'
        uses: actions/cache@v4
        with:
          path: |
            .ai-tmp/workspace/P5/R5/video-codecs-main10
            .ai-tmp/workspace/P5/R5/r4-hevc-v2-codec-identity.json
            .ai-tmp/workspace/P5/R5/cmake-build/vcpkg_installed
            ~/AppData/Local/vcpkg/downloads
          key: native-deps-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'tools/p5-r5-video-validation/sidecar-dependencies/**', 'tools/p5-r5-video-validation/profiles/P5-R5-v1/backend-build.json') }}
      - name: Check analysis storage / 检查分析存储
        shell: pwsh
        run: ./scripts/ci/check-codeql-storage.ps1
      - name: Initialize CodeQL / 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          # Keep the query database off the runner's D: workspace volume.
          db-location: C:/codeql-databases/${{ matrix.language }}
          ram: 10240
          threads: 2
      - name: Build Native project for managed analysis / 构建 Native（C# 分析用 Debug）
        if: matrix.language == 'csharp'
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/native/build-native.ps1
          -Configuration Debug
          -Architecture x64
      - name: Build Native project for C/C++ analysis / 构建 Native（C/C++ 分析用 Release）
        if: matrix.language == 'c-cpp'
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/native/build-native.ps1
          -Configuration Release
          -Architecture x64
      - name: Build managed projects / 构建托管项目
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet build "LivePhotoBox/LivePhotoBox.csproj" -c Debug -p:Platform=x64 -p:SkipNativeBuild=true
          dotnet build "LivePhotoBox.CLI/LivePhotoBox.CLI.csproj" -c Debug -p:Platform=x64 -p:SkipNativeBuild=true
      - name: Recheck analysis storage / 分析前复查存储
        shell: pwsh
        run: ./scripts/ci/check-codeql-storage.ps1
      - name: Analyze / 分析
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: C:/codeql-results/${{ matrix.language }}
          ram: 10240
          threads: 2
