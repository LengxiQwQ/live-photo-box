# insights.yml — 每天抓取 GitHub Traffic 数据并永久存档，防止 14 天窗口过期丢失
# insights.yml — Daily GitHub traffic archive: preserve Insights data beyond GitHub's 14-day window
#
# 触发：每天 UTC 02:17 定时 + 手动触发（Actions 页 → Run workflow）
# 读取：WINGET_TOKEN（已有 public_repo/repo 权限，GITHUB_TOKEN 无法访问 traffic API）
# 提交：用自动 GITHUB_TOKEN 推回仓库；commit 带 [skip ci]，避免触发 build.yml 白跑
#
# 产物（全部入库）：
#   insights/raw/<时间戳>.json   原始完整响应（永久归档，零丢弃）
#   insights/traffic.json        整理存档（views/clones 按日 upsert + 快照追加）
#   insights/chart.svg           趋势图（浅/深色两版）
#   README.md / README.zh-CN.md  双语数据区块（<!-- INSIGHTS:START/END --> 之间）

name: Repository Insights / 仓库洞察

on:
  schedule:
    - cron: '17 2 * * *'   # 每天 UTC 02:17（错开整点，避免与其他任务挤）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout / 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Collect traffic & render / 抓取、归档、渲染
        env:
          TRAFFIC_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/utils/collect.py

      - name: Commit & push / 提交并存档
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/ README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(insights): update repository traffic data [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push
