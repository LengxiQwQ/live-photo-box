# winget-releaser.yml — 发布 Release 后自动把新版本提交到 winget
# 触发：GitHub Release 正式发布（非 draft）→ 自动开 winget 更新 PR → 自动合入
# 前置条件：包必须已存在于 microsoft/winget-pkgs（首次由 PR #411313 合入建立）
# Token：WINGET_TOKEN 需有 public_repo / repo 权限（本机 gh token 可直接复用）
# 注意：更新已有 manifest 时，komac 保留原有 NestedInstallerFiles（4 个别名）不变，
#       只更新版本号 / URL / SHA256。首次更新后验证一次。

name: Publish to WinGet / winget 自动更新

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Release / 发布到 winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: LengxiQwQ.LivePhotoBox
          token: ${{ secrets.WINGET_TOKEN }}
          # portable.zip / setup.exe 不进 winget（winget 只发布 CLI）
          installers-regex: '-x64-cli\.zip$'

      # Komac 偶尔不会从旧版 defaultLocale 清单继承 Commands。
      # PortableCommandAlias 负责实际别名；Commands 负责 WinGet 的命令元数据，二者都要保留。
      - name: Preserve command metadata / 保留命令元数据
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.WINGET_TOKEN }}
          script: |
            const upstreamOwner = 'microsoft';
            const upstreamRepo = 'winget-pkgs';
            const forkOwner = context.repo.owner;
            const version = context.payload.release.tag_name.replace(/^v/, '');
            const title = `New version: LengxiQwQ.LivePhotoBox version ${version}`;

            const { data: pulls } = await github.rest.pulls.list({
              owner: upstreamOwner,
              repo: upstreamRepo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });
            const pull = pulls.find(pr =>
              pr.title === title && pr.head.repo?.owner.login === forkOwner);
            if (!pull) {
              core.setFailed(`Could not find the WinGet PR: ${title}`);
              return;
            }

            const manifestPath = `manifests/l/LengxiQwQ/LivePhotoBox/${version}/LengxiQwQ.LivePhotoBox.locale.en-US.yaml`;
            const { data: file } = await github.rest.repos.getContent({
              owner: forkOwner,
              repo: 'winget-pkgs',
              path: manifestPath,
              ref: pull.head.ref
            });
            let content = Buffer.from(file.content, 'base64').toString('utf8');
            if (/^Commands:\s*$/m.test(content)) {
              core.info('Commands metadata is already present.');
              return;
            }

            const commands = [
              'Commands:',
              '- livephotobox',
              '- livebox',
              '- lpb',
              '- livephoto',
              ''
            ].join('\n');
            content = content.replace(/^(Moniker:.*\r?\n)/m, `$1${commands}`);
            if (!/^Commands:\s*$/m.test(content)) {
              core.setFailed('Could not locate Moniker in the defaultLocale manifest.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: forkOwner,
              repo: 'winget-pkgs',
              path: manifestPath,
              branch: pull.head.ref,
              sha: file.sha,
              message: 'Preserve WinGet command metadata',
              content: Buffer.from(content, 'utf8').toString('base64')
            });
            core.info(`Added Commands metadata to PR #${pull.number}.`);
